services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: atlas-stay-app

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      db:
        condition: service_healthy

    networks:
      - atlas-stay-network


  nginx:
    image: nginx:alpine

    container_name: atlas-stay-nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - atlas-stay-network


  db:
    image: mysql:8.0

    container_name: atlas-stay-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: atlas_stay
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: atlas
      MYSQL_PASSWORD: atlas_password

    ports:
      - "3307:3306"

    volumes:
      - atlas-stay-db-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - atlas-stay-network


networks:
  atlas-stay-network:
    driver: bridge


volumes:
  atlas-stay-db-data: